<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14171A" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Rack &amp; File — a personal training log for a seven-day plan. Works offline, stores everything on your device."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rack&amp;File" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      How a language model asked to write a training plan for this app finds the
      contract. /llms.txt is the convention; the link is here so a model handed
      only the site URL can still discover it. Both files are generated at build
      time from the catalogue — see src/spec/planSpec.ts.
    -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="Training plan format for LLMs" />
    <title>Rack &amp; File</title>
  </head>
  <body>
    <header class="app-header">
      <!-- Populated by ui/components/weekStrip.ts -->
      <nav class="week" id="week" aria-label="Week"></nav>
    </header>

    <!-- Populated by the active view in ui/views/ -->
    <main class="app-main" id="view" tabindex="-1"></main>

    <!--
      Rest. `role="timer"` without a live region on purpose: announcing every
      tick would flood a screen reader. Completion is announced once, through
      the toast region below.

      This takes the screen rather than sitting in a 116px strip behind the tab
      bar. During rest there is nothing else to do, and the value of a glance
      from three metres away is high — which the old bar, a 16px stack of pips
      and a 26px clock, could not deliver.
    -->
    <section class="rest" id="rest" role="timer" aria-label="Rest timer" data-state="running" hidden>
      <div class="rest__inner" id="rest-running">
        <div class="rest__top">
          <div class="eyebrow" id="rest-plan"></div>
          <div class="eyebrow" id="rest-did"></div>
        </div>

        <div class="rest__stack" id="rest-stack" aria-hidden="true"></div>
        <div class="rest__clock mono" id="rest-clock">0:00</div>

        <!-- The effort question, asked about the set that was just done. -->
        <div class="rest__effort" id="rest-effort" hidden>
          <div class="rest__ask" id="rest-ask">How did that set feel?</div>
          <div class="choices__row" role="group" aria-labelledby="rest-ask">
            <button type="button" class="choices__button effort__button" data-effort="easy">Easy</button>
            <button type="button" class="choices__button effort__button" data-effort="right">Right</button>
            <button type="button" class="choices__button effort__button" data-effort="hard">Hard</button>
          </div>
          <div class="rest__note">Sets the next set's weight. Skip it and nothing changes.</div>
        </div>

        <div class="rest__warning" id="rest-warning" hidden></div>

        <div class="rest__actions">
          <button type="button" id="rest-add" aria-label="Add 30 seconds to rest">+30s</button>
          <button type="button" id="rest-skip" aria-label="Skip rest">Skip rest</button>
        </div>
      </div>

      <!--
        Rest over: a whole-screen colour flip, readable across a gym floor, with
        the next movement and its weight already on it. Green means go here and
        nothing else.
      -->
      <div class="rest__over" id="rest-over" hidden>
        <div class="rest__inner">
          <div class="eyebrow">Rest over</div>
          <div class="rest__next" id="rest-next"></div>
          <div class="rest__load mono" id="rest-load"></div>
          <div class="rest__nextmeta" id="rest-nextmeta"></div>
          <button type="button" class="button button--go" id="rest-go">Go</button>
        </div>
      </div>
    </section>

    <nav class="app-nav" id="nav" aria-label="Sections">
      <button type="button" data-tab="today" aria-current="page">Today</button>
      <button type="button" data-tab="history" aria-current="false">History</button>
      <button type="button" data-tab="plan" aria-current="false">Plan</button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
